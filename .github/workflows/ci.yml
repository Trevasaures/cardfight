name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cardfight_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cardfight_test_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U cardfight_test -d cardfight_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile backend
        run: |
          python -m compileall backend

      - name: Test backend
        env:
          CARDFIGHT_POSTGRES_TEST_URL: postgresql+psycopg://cardfight_test:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cardfight_test_ci
          CARDFIGHT_POSTGRES_TRANSFER_TEST_URL: postgresql+psycopg://cardfight_test:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cardfight_test_ci
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test
